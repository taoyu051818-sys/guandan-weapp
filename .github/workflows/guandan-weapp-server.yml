name: Guandan WeApp Server

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shared-core/**'
      - 'work/guandan-windows-source/server/**'
      - 'work/guandan-windows-source/package.json'
      - '.gitignore'
      - 'scripts/**'
      - 'asset-library/**'
      - '.github/workflows/guandan-weapp-server.yml'
  push:
    branches: [main]
    paths:
      - 'shared-core/**'
      - 'work/guandan-windows-source/server/**'
      - 'work/guandan-windows-source/package.json'
      - '.gitignore'
      - 'scripts/**'
      - 'asset-library/**'
      - '.github/workflows/guandan-weapp-server.yml'

permissions:
  contents: read

jobs:
  authoritative-game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work/guandan-windows-source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shared-core/pnpm-lock.yaml
      - name: Install shared core dependencies
        run: pnpm --dir ../../shared-core install --frozen-lockfile
      - name: Build shared core before import validation
        run: pnpm --dir ../../shared-core build
      - name: Check authoritative server syntax
        run: npm run check:weapp-server
      - name: Build shared core and run full platform/game regressions
        run: npm run test:server
      - name: Verify artifact inventory and isolated storage restore
        run: |
          node ../../scripts/release-manifest.test.mjs
          node ../../scripts/restore-drill.mjs
      - name: Exercise bounded local room concurrency (not production capacity)
        run: node ../../scripts/local-room-load.mjs 4 16
